<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Penang Itinerary | MyHeritage Explorer</title>
  <style>
    :root{--navy:#09285d;--gold:#a87513;--bg:#f5f7fb;--card:#fff;--muted:#687187;--border:#dfe4ee}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17203a}
    header{background:var(--navy);color:white;padding:18px 20px;font-weight:800;font-size:18px}
    main{max-width:920px;margin:auto;padding:22px 16px 50px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(16,38,76,.07)}
    .cover{width:100%;height:250px;object-fit:cover;background:#e8edf5}.hero{padding:18px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.6px}.hero h1{margin:7px 0 6px;color:var(--navy);font-size:30px}.muted{color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.chip{padding:8px 11px;border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:700;background:#fafbfd;color:var(--navy)}
    h2{color:var(--navy);margin:24px 0 12px}.stop{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:14px;margin-bottom:12px}.stop img{width:112px;height:112px;object-fit:cover;border-radius:12px;background:#e8edf5}.stop h3{margin:0 0 5px;color:var(--navy)}.meta{font-size:12px;color:var(--gold);font-weight:700}.address,.desc{font-size:12px;line-height:1.45;margin-top:7px}.rating{margin-top:9px;font-size:12px;font-weight:700;color:var(--navy)}
    .error{padding:30px;text-align:center}.loader{padding:60px;text-align:center;color:var(--muted)}
    @media(max-width:620px){.cover{height:190px}.hero h1{font-size:24px}.stop{grid-template-columns:92px 1fr}.stop img{width:92px;height:92px}}
  </style>
</head>
<body>
<header>MyHeritage Explorer</header>
<main id="app"><div class="card loader">Loading shared itinerary…</div></main>
<script>
const projectId='myheritage-4fe2f';
const params=new URLSearchParams(location.search);
const shareId=(params.get('id')||params.get('share')||'').trim();
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function decode(v){if(!v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return Number(v.doubleValue);if('booleanValue'in v)return v.booleanValue;if('timestampValue'in v)return v.timestampValue;if('nullValue'in v)return null;if('arrayValue'in v)return (v.arrayValue.values||[]).map(decode);if('mapValue'in v){const out={};for(const[k,x]of Object.entries(v.mapValue.fields||{}))out[k]=decode(x);return out}return null}
function placeholder(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520"><rect width="100%" height="100%" fill="#e8edf5"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#09285d" font-family="Arial" font-size="28">Place preview</text></svg>`)}
function image(url,cls='',fallback=''){const primary=url||fallback||placeholder();const safe=esc(primary);const fallbackSafe=esc(fallback||placeholder());return `<img class="${cls}" src="${safe}" data-fallback="${fallbackSafe}" onerror="const f=this.dataset.fallback;if(f&&this.src!==f){this.src=f;this.dataset.fallback='${placeholder()}'}else{this.onerror=null;this.src='${placeholder()}' }" alt="Place preview">`}
function render(d){const stops=Array.isArray(d.stops)?d.stops:[];const total=Number(d.totalEstimatedMinutes||0)||stops.reduce((n,s)=>n+Number(s.durationMinutes||60)+Number(s.travelMinutesBefore||0),0);const cover=d.coverImageUrl||stops[0]?.imageUrl||stops[0]?.fallbackImageUrl||'';const interests=Array.isArray(d.interests)?d.interests:[];app.innerHTML=`
  <section class="card">${image(cover,'cover')}<div class="hero"><div class="eyebrow">SHARED PENANG ITINERARY</div><h1>${esc(d.title||'Shared Itinerary')}</h1><div class="muted">${esc(d.area||'Penang')} • ${stops.length} stops • ${(total/60).toFixed(1)} hours</div><div class="chips"><span class="chip">${esc(d.travelPace||'Balanced')} pace</span><span class="chip">${esc(d.budgetLevel||'Medium')} budget</span>${interests.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div></section>
  <h2>Itinerary Route</h2>
  ${stops.map((s,i)=>`<article class="card stop">${image(s.imageUrl,'',s.fallbackImageUrl)}<div><h3>${i+1}. ${esc(s.name)}</h3><div class="meta">${esc(s.category||'Place')} • ${Number(s.durationMinutes||60)} minutes${Number(s.travelMinutesBefore||0)>0?' • '+Number(s.travelMinutesBefore)+' minutes travel':''}</div><div class="address muted">${esc(s.formattedAddress||s.area||'')}</div>${s.description?`<div class="desc">${esc(s.description)}</div>`:''}${Number(s.reviewCount||0)>0?`<div class="rating">★ ${Number(s.rating||0).toFixed(1)} (${Number(s.reviewCount)} reviews) ${esc(s.trustLabel||'')}</div>`:''}</div></article>`).join('')}
  <p class="muted" style="text-align:center;font-size:11px">Place information may change. Check opening hours before visiting.</p>`}
async function load(){if(!shareId){app.innerHTML='<div class="card error"><h2>Invalid share link</h2><p class="muted">The itinerary ID is missing.</p></div>';return}try{const url=`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/shared_itineraries/${encodeURIComponent(shareId)}`;const res=await fetch(url);if(!res.ok)throw new Error(res.status===404?'The shared itinerary was not found.':'The shared itinerary could not be opened.');const raw=await res.json();const d={};for(const[k,v]of Object.entries(raw.fields||{}))d[k]=decode(v);if(d.visibility!=='public')throw new Error('This itinerary is not public.');render(d)}catch(e){app.innerHTML=`<div class="card error"><h2>Unable to open itinerary</h2><p class="muted">${esc(e.message)}</p></div>`}}
load();
</script>
</body>
</html>
