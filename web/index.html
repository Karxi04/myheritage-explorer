<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="myheritage_explorer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Cache control to prevent stale browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>

  <title>myheritage_explorer</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) {
          reg.unregister();
        }
      });
    }
  </script>
</head>
<body>
  <script>
    (function() {
      try {
        var search = window.location.search || '';
        var params = new URLSearchParams(search);
        var shareId = params.get('share') || params.get('id');
        if (!shareId && window.location.pathname) {
          var parts = window.location.pathname.split('/').filter(Boolean);
          var idx = parts.indexOf('share');
          if (idx >= 0 && parts.length > idx + 1) {
            shareId = parts[idx + 1];
          }
        }
        if (shareId) {
          var cleanId = encodeURIComponent(shareId.trim());
          var isAndroid = /Android/i.test(navigator.userAgent);
          var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (isAndroid) {
            var intentUrl = 'intent://shared-itinerary?share=' + cleanId + '#Intent;scheme=myheritage;package=com.example.myheritage_explorer;end';
            window.location.href = intentUrl;
          } else if (isIOS) {
            window.location.href = 'myheritage://shared-itinerary?share=' + cleanId;
          }
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
